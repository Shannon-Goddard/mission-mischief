<body class="customBody">

  <header id="header" class="fixed-top">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="logo">
        <a href="../../index.html">Mission <span>Mischief</span></a>

      <div id="userInfo" style="color:#04aa6d; font-weight:bold; font-size:14px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></div>
    </div>
  </header>

  <main class="page-content">
    <div class="container">

      <!-- Instant missions banner -->
      <div style="background:rgba(4,170,109,0.1); border:1px solid #04aa6d; border-radius:8px; padding:12px 15px; margin-bottom:20px; text-align:center;">
        <p style="color:#fff; margin:0; font-size:13px; line-height:1.5;">
          ⚡ <strong>INSTANT MISSIONS</strong> — Submit with the green button, get points immediately.
          Add a social media URL as proof. <a href="../../core-game-files/help/how-to-play.html" style="color:#04aa6d;">How to play</a>
        </p>
      </div>

      <!-- Filters -->
      <div style="text-align:center; margin-bottom:20px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
        <button class="mission-btn active" id="filterAll" onclick="setFilter('all')">All</button>
        <button class="mission-btn" id="filterAvailable" onclick="setFilter('available')">Available</button>
        <button class="mission-btn" id="filterCompleted" onclick="setFilter('completed')">Completed</button>
      </div>

      <!-- Missions list -->
      <div id="missionsContainer"></div>

    </div>
