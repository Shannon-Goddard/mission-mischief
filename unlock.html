<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Mission Mischief — Join the Chaos</title>
  <link href="assets/images/ui/favicon.png" rel="icon">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,700" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Poppins', Arial, sans-serif;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    .unlock-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .mayhem-hero { text-align: center; margin-bottom: 20px; }
    .mayhem-hero img { width: 120px; height: 120px; object-fit: contain; }

    .unlock-title {
      text-align: center;
      color: #04aa6d;
      font-size: 1.8em;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .unlock-subtitle {
      text-align: center;
      color: #999;
      font-size: 0.95em;
      margin-bottom: 30px;
      font-style: italic;
    }

    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .card-title {
      color: #04aa6d;
      font-size: 0.85em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    .form-group { margin-bottom: 15px; }

    label {
      display: block;
      color: #ccc;
      font-size: 0.85em;
      margin-bottom: 6px;
    }

    input[type="text"], select {
      width: 100%;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 12px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #04aa6d;
    }

    input[type="file"] {
      width: 100%;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
    }

    #qrPreview { display: none; margin-top: 15px; }

    #qrContainer {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto;
      border: 2px solid #04aa6d;
      border-radius: 8px;
      overflow: hidden;
      background: #222;
    }

    #qrImage { position: absolute; cursor: move; }

    .qr-controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .qr-btn {
      background: #04aa6d;
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .qr-btn.reset { background: #444; color: #fff; }
    .qr-hint { text-align: center; color: #666; font-size: 11px; margin-top: 6px; }

    .unlock-btn {
      width: 100%;
      background: #04aa6d;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 16px;
      font-size: 1.1em;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .unlock-btn:hover { background: #05c47e; }
    .unlock-btn:active { transform: scale(0.98); }
    .unlock-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    select option { background: #222; }
    #cityFilter { margin-bottom: 8px; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #444;
      border-top-color: #04aa6d;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="unlock-container">

    <div class="mayhem-hero">
      <img src="assets/images/mascot/mayhem-drunk.png" alt="Mayhem">
    </div>

    <h1 class="unlock-title">🍺 JOIN THE CHAOS</h1>
    <p class="unlock-subtitle">"Set up your profile and start your missions."</p>

    <form id="unlockForm" onsubmit="handleUnlock(event)">

      <div class="card">
        <div class="card-title">👤 Your Profile</div>

        <div class="form-group">
          <label for="userName">Your Name</label>
          <input type="text" id="userName" placeholder="What do we call you?" maxlength="30" required>
        </div>

        <div class="form-group">
          <label for="userCountry">Country</label>
          <select id="userCountry" required onchange="loadStates();">
            <option value="">Select Country</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="UK">United Kingdom</option>
            <option value="AU">Australia</option>
            <option value="OTHER">Other</option>
          </select>
          <input type="text" id="userCountryOther" placeholder="Enter country" style="display:none; margin-top:8px;">
        </div>

        <div class="form-group">
          <label for="userState">State / Province</label>
          <select id="userState" required disabled onchange="loadCities(); toggleStateOther();">
            <option value="">Select State/Province</option>
          </select>
          <input type="text" id="userStateOther" placeholder="Enter state/province" style="display:none; margin-top:8px;">
        </div>

        <div class="form-group">
          <label for="userCity">City</label>
          <input type="text" id="cityFilter" placeholder="Type to filter cities..." style="display:none; margin-bottom:8px;" oninput="filterCities()">
          <select id="userCity" required disabled onchange="toggleCityOther()">
            <option value="">Select City</option>
          </select>
          <input type="text" id="userCityOther" placeholder="Enter city" style="display:none; margin-top:8px;">
        </div>
      </div>

      <div class="card">
        <div class="card-title">📱 Your Social QR Code</div>
        <div class="form-group">
          <label for="qrCode">Upload your social media QR code</label>
          <input type="file" id="qrCode" accept="image/*" required onchange="showQRPreview(this)">
          <small style="color:#666; font-size:11px; display:block; margin-top:5px;">
            This links your social posts to your game profile •
            <a href="core-game-files/help/qr-help.html" style="color:#04aa6d;">Need help?</a>
          </small>
        </div>

        <div id="qrPreview">
          <div id="qrContainer">
            <img id="qrImage" draggable="false">
            <div style="position:absolute; inset:0; border:2px dashed rgba(4,170,109,0.4); pointer-events:none; border-radius:6px;"></div>
          </div>
          <div class="qr-controls">
            <button type="button" class="qr-btn" onclick="zoomQR(-0.1)">🔍−</button>
            <button type="button" class="qr-btn" onclick="zoomQR(0.1)">🔍+</button>
            <button type="button" class="qr-btn reset" onclick="resetQR()">Reset</button>
          </div>
          <p class="qr-hint">Drag to position • Pinch or use buttons to zoom</p>
        </div>
      </div>

      <button type="submit" class="unlock-btn" id="unlockBtn">
        🍺 UNLOCK THE CHAOS
      </button>

    </form>

  </div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/toast.js"></script>

  <script>
    let locationData = {};
    let allCities = [];
    let qrScale = 1, qrX = 0, qrY = 0;

    document.addEventListener('DOMContentLoaded', () => {
      if (Storage.isFAFOCompleted()) {
        window.location.href = 'pages/dashboard/';
        return;
      }
      if (Storage.getUser().userName) {
        window.location.href = 'core-game-files/funny-tos.html';
        return;
      }
      loadLocationData();
    });

    async function handleUnlock(e) {
      e.preventDefault();

      const userName = document.getElementById('userName').value.trim();
      const country = document.getElementById('userCountry').value === 'OTHER'
        ? document.getElementById('userCountryOther').value.trim()
        : document.getElementById('userCountry').value;
      const state = document.getElementById('userState').value === 'OTHER'
        ? document.getElementById('userStateOther').value.trim()
        : document.getElementById('userState').value;
      const city = document.getElementById('userCity').value === 'OTHER'
        ? document.getElementById('userCityOther').value.trim()
        : document.getElementById('userCity').value;
      const qrImage = document.getElementById('qrImage');

      if (!userName || !country || !state || !city) {
        showToast('Fill in all fields', 'error');
        return;
      }

      if (!qrImage.src || qrImage.src === window.location.href) {
        showToast('Upload your QR code', 'error');
        return;
      }

      const btn = document.getElementById('unlockBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Unlocking...';

      Storage.saveKey('FREE', { userName, country, state, city, qrCodeData: qrImage.src });

      await Storage.syncToCloud();

      showToast('🍺 Chaos unlocked!', 'success');

      setTimeout(() => {
        window.location.href = 'core-game-files/funny-tos.html';
      }, 800);
    }

    // ── QR Code ───────────────────────────────────────────────────────────────

    window.showQRPreview = function(input) {
      if (!input.files?.[0]) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.getElementById('qrImage');
        img.src = e.target.result;
        document.getElementById('qrPreview').style.display = 'block';
        qrScale = 1; qrX = 0; qrY = 0;
        img.onload = () => {
          const c = document.getElementById('qrContainer');
          qrScale = Math.max(c.offsetWidth / img.naturalWidth, c.offsetHeight / img.naturalHeight);
          qrX = (c.offsetWidth - img.naturalWidth * qrScale) / 2;
          qrY = (c.offsetHeight - img.naturalHeight * qrScale) / 2;
          updateQRTransform();
        };
      };
      reader.readAsDataURL(input.files[0]);
    };

    let dragging = false, startX, startY;
    document.addEventListener('DOMContentLoaded', () => {
      const img = document.getElementById('qrImage');
      const container = document.getElementById('qrContainer');
      const onStart = (x, y) => { dragging = true; startX = x; startY = y; };
      const onMove = (x, y) => {
        if (!dragging) return;
        qrX += x - startX; qrY += y - startY;
        startX = x; startY = y;
        updateQRTransform();
      };
      const onEnd = () => { dragging = false; };
      img.addEventListener('mousedown', e => { e.preventDefault(); onStart(e.clientX, e.clientY); });
      img.addEventListener('touchstart', e => { e.preventDefault(); onStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
      document.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchend', onEnd);
      container.addEventListener('touchmove', e => {
        if (dragging) { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }
      }, { passive: false });
    });

    function updateQRTransform() {
      const img = document.getElementById('qrImage');
      if (img) {
        img.style.transform = `translate(${qrX}px, ${qrY}px) scale(${qrScale})`;
        img.style.transformOrigin = 'top left';
      }
    }

    window.zoomQR = delta => {
      qrScale = Math.max(0.1, Math.min(3, qrScale + delta));
      updateQRTransform();
    };

    window.resetQR = () => {
      const img = document.getElementById('qrImage');
      const c = document.getElementById('qrContainer');
      qrX = 0; qrY = 0;
      if (img.naturalWidth) {
        qrScale = Math.max(c.offsetWidth / img.naturalWidth, c.offsetHeight / img.naturalHeight);
      }
      updateQRTransform();
    };

    // ── Location Data ─────────────────────────────────────────────────────────

    function loadLocationData() {
      fetch('assets/js/usa-states-cities.json')
        .then(r => r.json())
        .then(data => {
          locationData.US = {};
          Object.entries(data).forEach(([, stateInfo]) => {
            locationData.US[stateInfo.name] = Object.keys(stateInfo.cities).sort();
          });
        })
        .catch(() => {
          locationData.US = {
            'California': ['Los Angeles', 'San Francisco', 'San Diego'],
            'New York': ['New York City', 'Buffalo'],
            'Texas': ['Houston', 'Dallas', 'Austin']
          };
        });
    }

    window.loadStates = function() {
      const country = document.getElementById('userCountry').value;
      const stateSelect = document.getElementById('userState');
      stateSelect.innerHTML = '<option value="">Select State/Province</option>';
      document.getElementById('userCity').innerHTML = '<option value="">Select City</option>';
      document.getElementById('userCity').disabled = true;
      document.getElementById('cityFilter').style.display = 'none';
      document.getElementById('userStateOther').style.display = 'none';
      document.getElementById('userCityOther').style.display = 'none';
      document.getElementById('userCountryOther').style.display = country === 'OTHER' ? 'block' : 'none';

      if (!country || country === 'OTHER') {
        stateSelect.style.display = 'none';
        document.getElementById('userStateOther').style.display = 'block';
        document.getElementById('userStateOther').required = true;
        document.getElementById('userCity').style.display = 'none';
        document.getElementById('userCityOther').style.display = 'block';
        document.getElementById('userCityOther').required = true;
      } else if (locationData[country]) {
        stateSelect.style.display = 'block';
        stateSelect.disabled = false;
        stateSelect.required = true;
        Object.keys(locationData[country]).sort().forEach(s => stateSelect.appendChild(new Option(s, s)));
        stateSelect.appendChild(new Option('Other (type below)', 'OTHER'));
      } else {
        stateSelect.style.display = 'none';
        document.getElementById('userStateOther').style.display = 'block';
        document.getElementById('userStateOther').required = true;
        document.getElementById('userCity').style.display = 'none';
        document.getElementById('userCityOther').style.display = 'block';
        document.getElementById('userCityOther').required = true;
      }
    };

    window.loadCities = function() {
      const country = document.getElementById('userCountry').value;
      const state = document.getElementById('userState').value;
      const citySelect = document.getElementById('userCity');
      const cityFilter = document.getElementById('cityFilter');
      citySelect.innerHTML = '<option value="">Select City</option>';
      document.getElementById('userCityOther').style.display = 'none';
      document.getElementById('userCityOther').required = false;
      cityFilter.style.display = 'none';
      allCities = [];

      if (state === 'OTHER') {
        citySelect.style.display = 'none';
        document.getElementById('userStateOther').style.display = 'block';
        document.getElementById('userStateOther').required = true;
        document.getElementById('userCityOther').style.display = 'block';
        document.getElementById('userCityOther').required = true;
      } else if (locationData[country]?.[state]) {
        allCities = locationData[country][state].slice();
        citySelect.style.display = 'block';
        citySelect.disabled = false;
        cityFilter.style.display = 'block';
        populateCities(allCities);
      }
    };

    function populateCities(cities) {
      const citySelect = document.getElementById('userCity');
      citySelect.innerHTML = '<option value="">Select City</option>';
      cities.forEach(c => citySelect.appendChild(new Option(c, c)));
      citySelect.appendChild(new Option('Other', 'OTHER'));
    }

    window.filterCities = function() {
      const filter = document.getElementById('cityFilter').value.toLowerCase();
      populateCities(filter ? allCities.filter(c => c.toLowerCase().includes(filter)) : allCities);
    };

    window.toggleStateOther = function() {
      const show = document.getElementById('userState').value === 'OTHER';
      document.getElementById('userStateOther').style.display = show ? 'block' : 'none';
      if (show) {
        document.getElementById('userCity').disabled = true;
        document.getElementById('userCityOther').style.display = 'block';
      }
    };

    window.toggleCityOther = function() {
      const show = document.getElementById('userCity').value === 'OTHER';
      document.getElementById('userCityOther').style.display = show ? 'block' : 'none';
    };
  </script>

</body>
</html>
